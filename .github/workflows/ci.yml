# Continuous integration: every push and pull request must pass these checks
# before it can be merged or deployed. No real secrets are used — every
# external provider runs in its development/test mode.
name: CI

on:
  push:
    branches: ['**']
  # Pull requests from forks (same-repository branches are covered by `push`).
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  checks:
    name: Format, typecheck, lint, unit tests
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Integration tests (PostgreSQL 16)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velora
          POSTGRES_PASSWORD: velora_ci_password
          POSTGRES_DB: velora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U velora -d velora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://velora:velora_ci_password@localhost:5432/velora_test
      SHADOW_DATABASE_URL: postgresql://velora:velora_ci_password@localhost:5432/velora_shadow
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create the shadow database used for the drift check
        run: psql "$TEST_DATABASE_URL" -c 'CREATE DATABASE velora_shadow'
      - name: Migrations match prisma/schema.prisma
        run: npm run db:validate
      - run: npm run test:integration

  build:
    name: Production build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public values inlined at build time. Server configuration is validated
      # when the server starts, not during the build.
      NEXT_PUBLIC_APP_URL: https://velora.example
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  performance:
    name: Query performance at scale
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velora
          POSTGRES_PASSWORD: velora_ci_password
          POSTGRES_DB: velora_perf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U velora -d velora_perf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Builds 10k products / 50k customers / 200k orders and times the hot queries.
      DATABASE_URL: postgresql://velora:velora_ci_password@localhost:5432/velora_perf_test
      APP_ENV: test
      NODE_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: ci-perf-auth-secret-that-is-long-enough-0123456789
      PAYMENT_PROVIDER: mock
      MOCK_PAYMENT_WEBHOOK_SECRET: ci-perf-mock-webhook-secret-0123456789
      VELORA_SILENT_LOGS: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run perf:benchmark

  e2e:
    name: End-to-end tests (Playwright)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velora
          POSTGRES_PASSWORD: velora_ci_password
          POSTGRES_DB: velora_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U velora -d velora_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # playwright.config.ts migrates and seeds this database, builds the app
      # and serves it with `next start` (mock payment and shipping providers).
      E2E_DATABASE_URL: postgresql://velora:velora_ci_password@localhost:5432/velora_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
